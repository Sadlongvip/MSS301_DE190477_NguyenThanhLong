name: saga-demo

services:
  # ---------- order-service DB ----------
  mysql:
    image: mysql:8.4
    container_name: saga-mysql
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
    ports:
      - "3307:3306"            # host 3307 để không đụng MySQL cài sẵn trên máy
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- payment-service DB ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saga-sqlserver
    mem_limit: 1200m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Saga@12345"   # phải đủ mạnh: chữ hoa, thường, số, ký tự đặc biệt
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"           # host 14330 để không đụng SQL Server cài sẵn trên máy
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Vừa kiểm tra SQL Server sẵn sàng, vừa tạo database paymentdb nếu chưa có
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Saga@12345' -C -Q \"IF DB_ID('paymentdb') IS NULL CREATE DATABASE paymentdb\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # ---------- inventory-service DB ----------
  mongodb:
    image: mongo:8.0
    container_name: saga-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]   # transaction trong MongoDB cần replica set, giới hạn cache 256MB
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Lần đầu: khởi tạo replica set 1 node; healthy khi node đã là PRIMARY
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # ---------- services ----------
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      MONGO_URI: mongodb://mongodb:27017/inventorydb?directConnection=true
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      mongodb:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=paymentdb;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: Saga@12345
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      sqlserver:
        condition: service_healthy

  # ---------- shipping-service DB (EXT-1) ----------
  postgres:
    image: postgres:16-alpine
    container_name: saga-postgres
    environment:
      POSTGRES_DB: shippingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shippingdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- shipping-service (EXT-1) ----------
  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shippingdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- message broker (EXT-3 Kafka Choreography) ----------
  kafka:
    image: apache/kafka:latest
    container_name: saga-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/orderdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root
      INVENTORY_URL: http://inventory-service:8082
      PAYMENT_URL: http://payment-service:8083
      SHIPPING_URL: http://shipping-service:8084
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-0}      # chỉ dùng cho KB8
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC"
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started

volumes:
  mysql-data:
  mssql-data:
  mongo-data:
  postgres-data: