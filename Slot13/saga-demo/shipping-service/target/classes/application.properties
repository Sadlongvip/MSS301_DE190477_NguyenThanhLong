server.port=8084
spring.application.name=shipping-service

# Mặc định khi chạy local dùng H2 (để không cần cài Postgres trên Windows),
# Khi chạy trong Docker sẽ được ghi đè bằng DB_URL, DB_DRIVER, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:mem:shippingdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Hiện message lỗi trong response trả về (Spring Boot 4: spring.web.error.include-message)
spring.web.error.include-message=always

# Tối ưu RAM: Giới hạn connection pool cho HikariCP
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
