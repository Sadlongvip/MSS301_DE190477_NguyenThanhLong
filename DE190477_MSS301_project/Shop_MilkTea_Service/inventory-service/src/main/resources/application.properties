# Application Name
spring.application.name=inventory-service

# Server Port (Chạy ở cổng 8082 để tránh xung đột với customer-service: 8081 và api-gateway: 9000)
server.port=8082

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/milk_tea_shop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=inventory_flyway_history

# Logging Configuration - Tinh gọn log console tránh tràn bộ đệm RAM
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
