# Application Name
spring.application.name=customer-service

# Server Port
server.port=8081

# Toi uu hoa luong Tomcat
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5

# MySQL Datasource Configuration (Database riêng: customer_db)
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Toi uu hoa HikariCP Connection Pool (tiet kiem RAM & ket noi MySQL)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=customer_flyway_history

# Logging Configuration - Tinh gọn log console tránh tràn bộ đệm RAM
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO

# Admin Account Configuration (In-memory / Không lưu vào Database)
app.admin.username=admin
app.admin.password=admin123
app.admin.role=ADMIN

# JWT Configuration - secret HS256 phải >= 32 ký tự và TRÙNG với api-gateway (nếu có)
app.jwt.secret=shop-milktea-service-secret-key-2026-mss301
app.jwt.expiration-minutes=60
