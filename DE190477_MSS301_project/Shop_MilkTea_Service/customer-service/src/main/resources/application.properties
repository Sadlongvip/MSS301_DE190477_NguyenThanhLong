# Application Name
spring.application.name=customer-service

# Server Port
server.port=8081

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/milk_tea_shop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Admin Account Configuration (In-memory / Không lưu vào Database)
app.admin.username=admin
app.admin.password=admin123
app.admin.role=ADMIN

# # Cấu hình Spring Security In-Memory (nếu có sử dụng Spring Security)
# spring.security.user.name=admin
# spring.security.user.password=admin123
# spring.security.user.roles=ADMIN

# JWT Configuration - secret HS256 phải >= 32 ký tự và TRÙNG với api-gateway (nếu có)
app.jwt.secret=shop-milktea-service-secret-key-2026-mss301
app.jwt.expiration-minutes=60
