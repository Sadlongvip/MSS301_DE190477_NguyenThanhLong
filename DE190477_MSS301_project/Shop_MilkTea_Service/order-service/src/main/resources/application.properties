# Application Name
spring.application.name=order-service

# Server Port (Chạy ở cổng 8083 theo cấu hình hệ thống: customer: 8081, inventory: 8082, order: 8083, api-gateway: 9000)
server.port=8083

# Toi uu hoa luong Tomcat
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5

# MySQL Datasource Configuration (Database riêng: order_db)
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Toi uu hoa HikariCP Connection Pool (tiet kiem RAM & ket noi MySQL)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=order_flyway_history

# Logging Configuration - Tinh gọn log console tránh tràn bộ đệm RAM
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO

# Cấu hình kết nối tới inventory-service
services.inventory.url=http://localhost:8082

# Cấu hình Spring Kafka (Saga Choreography)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

