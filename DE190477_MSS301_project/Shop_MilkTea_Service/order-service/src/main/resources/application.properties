# Application Name
spring.application.name=order-service

# Server Port (Chạy ở cổng 8083 theo cấu hình hệ thống: customer: 8081, inventory: 8082, order: 8083, api-gateway: 9000)
server.port=8083

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/milk_tea_shop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=order_flyway_history

# Logging Configuration - Tinh gọn log console tránh tràn bộ đệm RAM
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO

# Cấu hình kết nối tới inventory-service
services.inventory.url=http://localhost:8082

