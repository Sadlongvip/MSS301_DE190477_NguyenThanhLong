# Application Name
spring.application.name=report-service

# Datasource Configuration cho Test (ddl-auto=none để không yêu cầu kết nối DDL MySQL khi chạy test)
spring.datasource.url=jdbc:mysql://localhost:3306/report_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration cho Test (tắt migration trong môi trường test offline)
spring.flyway.enabled=false

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=report-group
spring.kafka.listener.auto-startup=false

# Services URL
services.order.url=http://localhost:8083
services.inventory.url=http://localhost:8082
services.customer.url=http://localhost:8081
